   <BODY>

    

    <script>
       let username = prompt("Please enter your username:");
let password = prompt("Please enter your password:");

for (let i = 1; i <= 3; i++) {
  let uu = prompt("Please re-enter your username:");
  let ps = prompt("Please re-enter your password:");

  if (uu === username && ps === password) {
    alert("Access granted!");
    alert("Welcome to this website, " + username + "!");
    break;
  } else {
    alert("Incorrect username or password. Please try again.");
  }

  if (i === 3) {
    alert("Access denied. You have exceeded the maximum number of attempts.");
  }
}

    </script>
   </BODY>
</HTML>
